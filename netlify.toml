[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

# SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API proxy (set your backend URL here after deploying backend)
# Example:
#   to = "https://my-portfolio-backend.onrender.com/api/:splat"
[[redirects]]
  from = "/api/*"
  to = "https://my-portfolio-production-22e7.up.railway.app/api/:splat"
  status = 200
  force = true
